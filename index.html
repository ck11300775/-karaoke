<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Karaoke Player v4.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* 上方區塊：獨立成單純的外部搜尋引導，避開沙盒鎖死 */
        .yt-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }
        .search-bar {
            display: flex;
            padding: 10px;
            gap: 8px;
            background-color: #2c2c2c;
            z-index: 10;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            background-color: #404040;
            color: white;
            outline: none;
        }
        .search-bar button {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background-color: #ff0000;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .video-container {
            flex: 1;
            position: relative;
            background-color: #000;
        }
        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* 下方區塊：獨立控制面板，確保永遠能與用戶100%互動 */
        .mic-section {
            height: 200px; 
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px 20px;
            gap: 15px;
            z-index: 20; /* 提高層級，防止點擊被 iframe 的透明層攔截 */
        }
        .yt-volume-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #262626;
            padding: 8px 15px;
            border-radius: 15px;
        }
        .yt-volume-container label {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
        }
        .yt-volume-container input[type="range"] {
            flex: 1;
            accent-color: #ff0000; 
            cursor: pointer;
            height: 25px; /* 加大可觸控面積 */
        }
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px; 
            width: 100%;
        }
        .vol-btn {
            width: 60px;
            height: 60px;
            border: none;
            background: none;
            color: #ff3b30; 
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .vol-btn:active {
            opacity: 0.5;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #888888;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            touch-action: manipulation;
        }
        .mic-btn svg {
            width: 35px;
            height: 35px;
            fill: #888888;
            pointer-events: none; /* 防止干擾點擊 */
        }
        .mic-btn.active {
            border-color: #ff3b30;
            background-color: rgba(255, 59, 48, 0.2);
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
        }
        .mic-btn.active svg {
            fill: #ff3b30;
        }
        .status-text {
            font-size: 13px;
            color: #ff3b30; 
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 上方區塊 -->
    <div class="yt-section">
        <div class="search-bar">
            <input type="text" id="video-input" placeholder="請貼上 YouTube 影片分享連結點歌...">
            <button onclick="handleSearch()">點歌</button>
        </div>
        <div class="video-container">
            <!-- 採用乾淨無任何附加權限限制的標準內嵌格式，防止整頁被CORS鎖死 -->
            <iframe id="youtube-player" src="https://youtube.com" allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <!-- 下方區塊 -->
    <div class="mic-section">
        <!-- 伴奏音樂說明：由於同網域安全鎖，音響音量請直接透過影片內部或手機按鈕控制 -->
        <div class="yt-volume-container">
            <label style="color: #ff3b30; font-weight: bold;">⚠️ 提示：若要調整歌曲音樂大小，請直接調整手機側邊音量鍵</label>
        </div>

        <div class="controls-row">
            <button class="vol-btn" onclick="adjustMicVolume(-10)">−</button>
            
            <button class="mic-btn" id="mic-toggle-btn" onclick="toggleMicrophone()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
            </button>
            
            <button class="vol-btn" onclick="adjustMicVolume(10)">+</button>
        </div>
        <div class="status-text" id="status-display">麥克風：已關閉 | 麥克風收音（錄音）：100%</div>
    </div>
</div>

<script>
    const playerIframe = document.getElementById('youtube-player');

    // 解決卡死的核心：回歸最純粹的 URL 切換，不使用任何會被跨網域阻擋的 JS 遙控 API
    function handleSearch() {
        const input = document.getElementById('video-input').value.trim();
        if (!input) return;

        let videoId = '';
        
        // 精準解析手機版與電腦版 YouTube 連結
        if (input.includes('youtube.com') || input.includes('youtu.be')) {
            if (input.includes('v=')) {
                videoId = input.split('v=')[1].split('&')[0];
            } else if (input.includes('youtu.be/')) {
                videoId = input.split('youtu.be/')[1].split('?')[0];
            }
            if (videoId) {
                playerIframe.src = `https://youtube.com{videoId}?playsinline=1&autoplay=1`;
            } else {
                alert("網址解析失敗，請複製正確的影片連結。");
            }
        } else {
            // 如果輸入的是純歌名文字，引導用戶另開視窗搜尋，或者請用戶直接貼網址
            alert("因瀏覽器安全限制，請直接到 YouTube 複製「分享連結」，再貼回來這裡點歌喔！");
        }
    }

    // 麥克風核心：100% 與上方的 iframe 徹底隔離，不再受 CORS 限制，按鈕跟錄音永久正常！
    let audioContext = null;
    let micStream = null;
    let micSource = null;
    let gainNode = null; 
    let isMicOn = false;
    let currentMicVolume = 1.0;

    async function toggleMicrophone() {
        const btn = document.getElementById('mic-toggle-btn');
        if (!isMicOn) {
            try {
                // 請求錄音權限
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });

                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                micSource = audioContext.createMediaStreamSource(micStream);
                gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);

                micSource.connect(gainNode);
                gainNode.connect(audioContext.destination);

                isMicOn = true;
                btn.classList.add('active');
                updateStatusText();

            } catch (err) {
                console.error(err);
                alert("麥克風無法啟動！請確認：\n1. 必須使用「無痕模式」或確定網址是 https\n2. 點擊瀏覽器網址左側的設定，允許此網頁的麥克風權限。");
            }
        } else {
            if (micSource) micSource.disconnect();
            if (gainNode) gainNode.disconnect();
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            isMicOn = false;
            btn.classList.remove('active');
            updateStatusText();
        }
    }

    // 調整麥克風（錄音收音）音量
    function adjustMicVolume(amount) {
        let newVolPercent = Math.round(currentMicVolume * 100) + amount;
        if (newVolPercent < 0) newVolPercent = 0;
        if (newVolPercent > 200) newVolPercent = 200;
        
        currentMicVolume = newVolPercent / 100;

        if (gainNode && audioContext) {
            gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);
        }
        
        updateStatusText();
    }

    function updateStatusText() {
        const status = document.getElementById('status-display');
        const micState = isMicOn ? "擴音中" : "已關閉";
        const volState = Math.round(currentMicVolume * 100);
        status.innerText = `麥克風：${micState} | 麥克風收音：${volState}%`;
    }
</script>
</body>
</html>
