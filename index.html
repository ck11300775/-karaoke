<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 改名：網頁標題 -->
    <title>網頁擴音器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 20px;
        }
        /* 大標題 */
        h1 {
            font-size: 24px;
            color: #ff3b30;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px; 
            width: 100%;
            position: relative;
        }
        .vol-btn {
            width: 60px;
            height: 60px;
            border: none;
            background: none;
            color: #ff3b30; 
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            z-index: 10;
        }
        .vol-btn:active {
            opacity: 0.5;
        }
        /* 視覺化容器：確保畫布與圓形按鈕疊在一起 */
        .visualizer-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 頻譜畫布：負責繪製圖中像鋸齒波浪的動態線條 */
        #spectrum-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        /* 圓形麥克風按鈕 */
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #888888;
            background-color: #1a1a1a; /* 像圖中的黑底圓形 */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            touch-action: manipulation;
            z-index: 5;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .mic-btn svg {
            width: 45px;
            height: 45px;
            fill: #888888;
            pointer-events: none;
            transition: fill 0.2s;
        }
        /* 啟動時的外觀 */
        .mic-btn.active {
            border-color: #ff3b30;
            background-color: #2c0e0c;
        }
        .mic-btn.active svg {
            fill: #ff3b30;
        }
        .status-text {
            font-size: 14px;
            color: #ff3b30; 
            font-weight: 500;
            text-align: center;
            line-height: 1.6;
        }
        /* 濾鏡狀態面板 */
        .filter-panel {
            background-color: #1a1a1a;
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 12px;
            color: #888;
            border: 1px solid #333;
        }
        .filter-panel span {
            color: #00e676; /* 綠色打勾標示 */
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="mic-section">
    <!-- 改名：網頁大標題 -->
    <h1>網頁擴音器</h1>

    <!-- 濾鏡功能啟用提示面板 -->
    <div class="filter-panel">
        🛡️ 安全濾鏡：<span>✓ 已開啟防回音</span> | <span>✓ 已開啟去雜音</span>
    </div>

    <div class="controls-row">
        <button class="vol-btn" onclick="adjustMicVolume(-10)">−</button>
        
        <!-- 包含頻譜的按鈕區塊 -->
        <div class="visualizer-container">
            <canvas id="spectrum-canvas" width="180" height="180"></canvas>
            <button class="mic-btn" id="mic-toggle-btn" onclick="toggleMicrophone()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
            </button>
        </div>
        
        <button class="vol-btn" onclick="adjustMicVolume(10)">+</button>
    </div>
    
    <div class="status-text" id="status-display">麥克風：已關閉<br>麥克風收音：100%</div>
</div>

<script>
    let audioContext = null;
    let micStream = null;
    let micSource = null;
    let gainNode = null; 
    let analyserNode = null; 
    let animationFrameId = null; 
    let isMicOn = false;
    let currentMicVolume = 1.0;

    const canvas = document.getElementById('spectrum-canvas');
    const canvasCtx = canvas.getContext('2d');

    async function toggleMicrophone() {
        const btn = document.getElementById('mic-toggle-btn');
        if (!isMicOn) {
            try {
                // === 關鍵技術：開啟防回音（Echo）與去雜音（Noise）===
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, // 核心：強制啟用硬體級防回音抑制
                        noiseSuppression: true, // 核心：強制啟用智慧去雜音與背景噪聲消除
                        autoGainControl: true   // 自動增益控制，穩定說話音量
                    } 
                });

                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({
                        sampleRate: 48000
                    });
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                micSource = audioContext.createMediaStreamSource(micStream);
                gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);

                // 配置頻譜分析器
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 128; // 高低音採樣點數量，控制鋸齒密集度

                micSource.connect(gainNode);
                gainNode.connect(analyserNode);
                analyserNode.connect(audioContext.destination);

                isMicOn = true;
                btn.classList.add('active');
                updateStatusText();

                // 啟動圓形鋸齒頻譜繪製
                drawCircularSpectrum();

            } catch (err) {
                console.error(err);
                alert("無法開啟麥克風！請確認：\n1. 網址開頭必須是 https\n2. 必須開啟瀏覽器的麥克風授權。");
            }
        } else {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            // 清除畫布
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            if (micSource) micSource.disconnect();
            if (gainNode) gainNode.disconnect();
            if (analyserNode) analyserNode.disconnect();
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            isMicOn = false;
            btn.classList.remove('active');
            updateStatusText();
        }
    }

    // === 核心繪圖邏輯：完全還原參考圖中圍繞圓形的噴發頻譜波浪 ===
    function drawCircularSpectrum() {
        if (!isMicOn || !analyserNode) return;

        const bufferLength = analyserNode.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        // 抓取當下的頻率（高低音）數據
        analyserNode.getByteFrequencyData(dataArray);

        // 每影格清空畫布
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const baseRadius = 52; // 線條噴發的基礎圓形內圈半徑（剛好貼在100px的按鈕外圍）

        canvasCtx.beginPath();
        canvasCtx.strokeStyle = '#ff3b30'; // 鋸齒頻譜線條顏色
        canvasCtx.lineWidth = 2.5;         // 線條粗細
        canvasCtx.lineJoin = 'round';

        // 將 360 度圓周分割，循環繪製每個頻率對應的鋸齒突起
        for (let i = 0; i < bufferLength; i++) {
            // 對頻率強度進行等比例縮放算出力道大小
            const value = dataArray[i];
            const percent = value / 255;
            const spikeHeight = percent * 25; // 限制鋸齒最大向外噴發 25 像素

            // 計算出目前這根鋸齒在圓形外圈的角度 (360度環繞)
            const angle = (i / bufferLength) * Math.PI * 2;
            
            // 基礎半徑加上噴發高度
            const currentRadius = baseRadius + spikeHeight;

            // 三角函數算出畫布上的 XY 座標點
            const x = centerX + Math.cos(angle) * currentRadius;
            const y = centerY + Math.sin(angle) * currentRadius;

            if (i === 0) {
                canvasCtx.moveTo(x, y);
            } else {
                canvasCtx.lineTo(x, y);
            }
        }
        
        canvasCtx.closePath(); // 封閉圓形線條
        canvasCtx.stroke();

        // 循環更新動畫
        animationFrameId = requestAnimationFrame(drawCircularSpectrum);
    }

    function adjustMicVolume(amount) {
        let newVolPercent = Math.round(currentMicVolume * 100) + amount;
        if (newVolPercent < 0) newVolPercent = 0;
        if (newVolPercent > 200) newVolPercent = 200;
        
        currentMicVolume = newVolPercent / 100;

        if (gainNode && audioContext) {
            gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);
        }
        
        updateStatusText();
    }

    function updateStatusText() {
        const status = document.getElementById('status-display');
        const micState = isMicOn ? "擴音中" : "已關閉";
        const volState = Math.round(currentMicVolume * 100);
