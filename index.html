<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Karaoke Player v3.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* 上方區塊：YT 搜尋與播放 */
        .yt-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }
        .search-bar {
            display: flex;
            padding: 10px;
            gap: 8px;
            background-color: #2c2c2c;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            background-color: #404040;
            color: white;
            outline: none;
        }
        .search-bar button {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background-color: #ff0000;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .video-container {
            flex: 1;
            position: relative;
            background-color: #000;
        }
        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* 下方區塊：控制面板 */
        .mic-section {
            height: 220px; 
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px 20px;
            gap: 15px;
        }
        /* 伴奏音量控制區 */
        .yt-volume-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #262626;
            padding: 8px 15px;
            border-radius: 15px;
        }
        .yt-volume-container label {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
        }
        .yt-volume-container input[type="range"] {
            flex: 1;
            accent-color: #ff0000; 
            cursor: pointer;
        }
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px; 
            width: 100%;
        }
        /* 紅色的音量控制鍵（單獨調整錄音部分） */
        .vol-btn {
            width: 60px;
            height: 60px;
            border: none;
            background: none;
            color: #ff3b30; 
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .vol-btn:active {
            opacity: 0.5;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #888888;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .mic-btn svg {
            width: 35px;
            height: 35px;
            fill: #888888;
            transition: all 0.2s ease;
        }
        .mic-btn.active {
            border-color: #ff3b30;
            background-color: rgba(255, 59, 48, 0.2);
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
        }
        .mic-btn.active svg {
            fill: #ff3b30;
        }
        .status-text {
            font-size: 13px;
            color: #ff3b30; 
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 上方區塊 -->
    <div class="yt-section">
        <div class="search-bar">
            <input type="text" id="video-input" placeholder="貼上網址，或輸入歌名搜尋...">
            <button onclick="handleSearch()">點歌</button>
        </div>
        <div class="video-container">
            <!-- 初始預設先放一般 iframe 確保載入，後面透過 JS 動態安全切換 -->
            <iframe id="youtube-player" src="https://youtube.com" allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <!-- 下方區塊 -->
    <div class="mic-section">
        <!-- 伴奏音樂音量滑桿 -->
        <div class="yt-volume-container">
            <label id="yt-vol-label">伴奏音量: 80%</label>
            <input type="range" id="yt-volume-slider" min="0" max="100" value="80" oninput="adjustYTVolume(this.value)">
        </div>

        <div class="controls-row">
            <!-- 減少麥克風收音音量 -->
            <button class="vol-btn" onclick="adjustMicVolume(-10)">−</button>
            
            <!-- 圓形麥克風開關 -->
            <button class="mic-btn" id="mic-toggle-btn" onclick="toggleMicrophone()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
            </button>
            
            <!-- 增加麥克風收音音量 -->
            <button class="vol-btn" onclick="adjustMicVolume(10)">+</button>
        </div>
        <div class="status-text" id="status-display">麥克風：已關閉 | 麥克風收音：100%</div>
    </div>
</div>

<script>
    let playerIframe = document.getElementById('youtube-player');
    let currentYTVolume = 80;

    // 安全的網址/關鍵字處理邏輯
    function handleSearch() {
        const input = document.getElementById('video-input').value.trim();
        if (!input) return;

        let videoId = '';
        
        // 判斷是否為 YouTube 連結
        if (input.includes('youtube.com') || input.includes('youtu.be')) {
            if (input.includes('v=')) {
                videoId = input.split('v=')[1].split('&')[0];
            } else if (input.includes('youtu.be/')) {
                videoId = input.split('youtu.be/')[1].split('?')[0];
            }
            if (videoId) {
                // 直接切換 iframe 的 src 來安全換歌，繞過廢棄的 API 功能限制
                playerIframe.src = `https://youtube.com{videoId}?enablejsapi=1&playsinline=1&autoplay=1`;
            }
        } else {
            // 如果輸入的是關鍵字，自動封裝成 YouTube 官方行動版搜尋頁面並直接載入，使用者可以直接在裡面挑歌點擊播放！
            const encodedKeyword = encodeURIComponent(input);
            playerIframe.src = `https://youtube.com{encodedKeyword}`;
        }
    }

    // 調整伴奏音量（透過向嵌入的 iframe 發送標準控制指令）
    function adjustYTVolume(value) {
        currentYTVolume = parseInt(value);
        document.getElementById('yt-vol-label').innerText = `伴奏音量: ${currentYTVolume}%`;
        
        // 發送 postMessage 音量指令給 YouTube Iframe
        if (playerIframe && playerIframe.contentWindow) {
            playerIframe.contentWindow.postMessage(JSON.stringify({
                event: 'command',
                func: 'setVolume',
                args: [currentYTVolume]
            }), '*');
        }
    }

    // 麥克風與 Web Audio 核心錄音/放音邏輯 (保持獨立，不受換歌影響)
    let audioContext = null;
    let micStream = null;
    let micSource = null;
    let gainNode = null; 
    let isMicOn = false;
    let currentMicVolume = 1.0;

    async function toggleMicrophone() {
        const btn = document.getElementById('mic-toggle-btn');
        if (!isMicOn) {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                micSource = audioContext.createMediaStreamSource(micStream);
                
                gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);

                micSource.connect(gainNode);
                gainNode.connect(audioContext.destination);

                isMicOn = true;
                btn.classList.add('active');
                updateStatusText();

            } catch (err) {
                console.error(err);
                alert("無法開啟麥克風，請在手機設定中確認瀏覽器的麥克風權限已開啟。");
            }
        } else {
            if (micSource) micSource.disconnect();
            if (gainNode) gainNode.disconnect();
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            isMicOn = false;
            btn.classList.remove('active');
            updateStatusText();
        }
    }

    function adjustMicVolume(amount) {
        let newVolPercent = Math.round(currentMicVolume * 100) + amount;
        if (newVolPercent < 0) newVolPercent = 0;
        if (newVolPercent > 200) newVolPercent = 200;
        
        currentMicVolume = newVolPercent / 100;

        if (gainNode && audioContext) {
            gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);
        }
        
        updateStatusText();
    }
