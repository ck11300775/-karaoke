<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁擴音器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px; /* 加大按鈕與下方文字的間距，讓排版更和諧 */
            padding: 20px;
        }
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px; 
            width: 100%;
        }
        .vol-btn {
            width: 60px;
            height: 60px;
            border: none;
            background: none;
            color: #ff3b30; 
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .vol-btn:active {
            opacity: 0.5;
        }
        .visualizer-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #spectrum-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #888888;
            background-color: #1a1a1a; 
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            touch-action: manipulation;
            z-index: 5;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .mic-btn svg {
            width: 45px;
            height: 45px;
            fill: #888888;
            pointer-events: none;
        }
        .mic-btn.active {
            border-color: #ff3b30;
            background-color: #2c0e0c;
        }
        .mic-btn.active svg {
            fill: #ff3b30;
        }
        .status-text {
            font-size: 14px;
            color: #ff3b30; 
            font-weight: 500;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="mic-section">
    <!-- 頂部的大標題與安全濾鏡面板已被徹底拔除，維持極簡 -->

    <div class="controls-row">
        <!-- 減少麥克風收音音量 -->
        <button class="vol-btn" onclick="adjustMicVolume(-10)">−</button>
        
        <div class="visualizer-container">
            <!-- 圓形音訊頻譜畫布 -->
            <canvas id="spectrum-canvas" width="180" height="180"></canvas>
            <!-- 圓形麥克風開關 -->
            <button class="mic-btn" id="mic-toggle-btn" onclick="toggleMicrophone()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
            </button>
        </div>
        
        <!-- 增加麥克風收音音量 -->
        <button class="vol-btn" onclick="adjustMicVolume(10)">+</button>
    </div>
    
    <!-- 狀態與音量數值顯示 -->
    <div class="status-text" id="status-display">麥克風：已關閉<br>麥克風收音：100%</div>
</div>

<script>
    let audioContext = null;
    let micStream = null;
    let micSource = null;
    let gainNode = null; 
    let analyserNode = null; 
    let animationFrameId = null; 
    let isMicOn = false;
    let currentMicVolume = 1.0;

    const canvas = document.getElementById('spectrum-canvas');
    const canvasCtx = canvas.getContext('2d');

    async function toggleMicrophone() {
        const btn = document.getElementById('mic-toggle-btn');
        if (!isMicOn) {
            try {
                // 雖然畫面拔除了提示，但底層依舊保留最強大的防回音與去雜音技術
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true, 
                        autoGainControl: true   
                    } 
                });

                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({
                        sampleRate: 48000
                    });
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                micSource = audioContext.createMediaStreamSource(micStream);
                gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);

                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 64; 

                micSource.connect(gainNode);
                gainNode.connect(analyserNode);
                analyserNode.connect(audioContext.destination);

                isMicOn = true;
                btn.classList.add('active');
                updateStatusText();

                // 啟動圓形頻譜動畫
                drawCircularSpectrum();

            } catch (err) {
                console.error(err);
                alert("無法開啟麥克風！請確認網址開頭為 https 並已授權權限。");
            }
        } else {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            if (micSource) micSource.disconnect();
            if (gainNode) gainNode.disconnect();
            if (analyserNode) analyserNode.disconnect();
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            isMicOn = false;
            btn.classList.remove('active');
            updateStatusText();
        }
    }

    function drawCircularSpectrum() {
        if (!isMicOn || !analyserNode) return;

        const bufferLength = analyserNode.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyserNode.getByteFrequencyData(dataArray);

        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

        const centerX = 90;
        const centerY = 90;
        const baseRadius = 53; 

        canvasCtx.beginPath();
        canvasCtx.strokeStyle = '#ff3b30'; 
        canvasCtx.lineWidth = 3;         
        canvasCtx.lineJoin = 'round';

        let hasStarted = false;

        for (let i = 0; i < bufferLength; i++) {
            const value = dataArray[i];
            const percent = value / 255;
            const spikeHeight = percent * 22; 

            const angle = (i / bufferLength) * Math.PI * 2;
            const currentRadius = baseRadius + spikeHeight;

            const x = centerX + Math.cos(angle) * currentRadius;
            const y = centerY + Math.sin(angle) * currentRadius;

            if (isNaN(x) || isNaN(y)) continue;

            if (!hasStarted) {
                canvasCtx.moveTo(x, y);
                hasStarted = true;
            } else {
                canvasCtx.lineTo(x, y);
            }
        }
        
        if (hasStarted) {
            canvasCtx.closePath();
            canvasCtx.stroke();
        }

        animationFrameId = requestAnimationFrame(drawCircularSpectrum);
    }

    function adjustMicVolume(amount) {
        let newVolPercent = Math.round(currentMicVolume * 100) + amount;
        if (newVolPercent < 0) newVolPercent = 0;
        if (newVolPercent > 200) newVolPercent = 200;
        
        currentMicVolume = newVolPercent / 100;

        if (gainNode && audioContext) {
            gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);
        }
        
        updateStatusText();
    }

    // 狀態字串維持您的經典黑底紅字配色
    function updateStatusText() {
        const status = document.getElementById('status-display');
        const micState = isMicOn ? "擴音中" : "已關閉";
        const volState = Math.round(currentMicVolume * 100);
        status.innerText = `麥克風：${micState}\n麥克風收音：${volState}%`;
    }
</script>
</body>
</html>
