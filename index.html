<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Karaoke Player</title>
    <style>
        /* 依據您的手繪草圖設計的 CSS 佈局 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* 上方區塊：YouTube 播放器與搜尋 */
        .yt-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }
        .search-bar {
            display: flex;
            padding: 10px;
            gap: 8px;
            background-color: #2c2c2c;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            background-color: #404040;
            color: white;
            outline: none;
        }
        .search-bar button {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background-color: #ff0000;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .video-container {
            flex: 1;
            position: relative;
            background-color: #000;
        }
        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* 下方區塊：草圖中的麥克風控制面板 */
        .mic-section {
            height: 160px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #888888;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .mic-btn svg {
            width: 35px;
            height: 35px;
            fill: #888888;
            transition: all 0.2s ease;
        }
        /* 麥克風啟動狀態的樣式 */
        .mic-btn.active {
            border-color: #ff3b30;
            background-color: rgba(255, 59, 48, 0.2);
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
        }
        .mic-btn.active svg {
            fill: #ff3b30;
        }
        .status-text {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 上方區塊：YT 搜尋與播放 (對應草圖中的 yt) -->
    <div class="yt-section">
        <div class="search-bar">
            <input type="text" id="video-input" placeholder="請貼上 YouTube 影片網址或輸入 ID...">
            <button onclick="loadVideo()">點歌</button>
        </div>
        <div class="video-container">
            <div id="youtube-player"></div>
        </div>
    </div>

    <!-- 下方區塊：麥克風開關 (對應草圖底部的圓形麥克風) -->
    <div class="mic-section">
        <button class="mic-btn" id="mic-toggle-btn" onclick="toggleMicrophone()">
            <!-- 麥克風 SVG 圖示 -->
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
        </button>
        <div class="status-text" id="status-display">麥克風已關閉</div>
    </div>
</div>

<!-- 載入 YouTube 官方 IFrame API -->
<script src="https://youtube.com"></script>
<script>
    // 1. YouTube 播放器初始化
    let player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
            videoId: 'dQw4w9WgXcQ', // 預設測試影片 ID
            playerVars: {
                'playsinline': 1,
                'controls': 1
            }
        });
    }

    function loadVideo() {
        const input = document.getElementById('video-input').value.trim();
        let videoId = input;
        
        // 簡單解析可能的 YouTube 網址格式
        if (input.includes('v=')) {
            videoId = input.split('v=')[1].split('&')[0];
        } else if (input.includes('youtu.be/')) {
            videoId = input.split('youtu.be/')[1].split('?')[0];
        }
        
        if (videoId && player && player.loadVideoById) {
            player.loadVideoById(videoId);
        } else {
            alert('請輸入有效的 YouTube 影片網址或 ID');
        }
    }

    // 2. Web Audio API 麥克風導向輸出核心邏輯
    let audioContext = null;
    let micStream = null;
    let micSource = null;
    let isMicOn = false;

    async function toggleMicrophone() {
        const btn = document.getElementById('mic-toggle-btn');
        const status = document.getElementById('status-display');

        if (!isMicOn) {
            try {
                // 請求使用者麥克風權限
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false, // 關閉瀏覽器自帶的通話降噪，保留原音
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });

                // 初始化音訊上下文
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                // 確保 Context 沒有被瀏覽器自動掛起
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // 建立麥克風節點並直接連線到輸出（喇叭/藍牙）
                micSource = audioContext.createMediaStreamSource(micStream);
                micSource.connect(audioContext.destination);

                // 更新 UI 狀態
                isMicOn = true;
                btn.classList.add('active');
                status.innerText = "麥克風擴音中";

            } catch (err) {
                console.error("無法存取麥克風:", err);
                alert("啟動麥克風失敗，請確保已授權麥克風權限。");
            }
        } else {
            // 關閉麥克風串流
            if (micSource) micSource.disconnect();
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            
            isMicOn = false;
            btn.classList.remove('active');
            status.innerText = "麥克風已關閉";
        }
    }
</script>
</body>
</html>
