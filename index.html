<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁擴音器 v4.5</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px; 
            width: 100%;
        }
        .vol-btn {
            width: 60px;
            height: 60px;
            border: none;
            background: none;
            color: #ff3b30; 
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .vol-btn:active {
            opacity: 0.5;
        }
        /* 麥克風按鈕外圈：新增發光與縮放的平滑動畫過渡 */
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #888888;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            touch-action: manipulation;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.05s ease, transform 0.05s ease;
        }
        .mic-btn svg {
            width: 45px;
            height: 45px;
            fill: #888888;
            pointer-events: none;
            transition: fill 0.2s;
        }
        /* 啟動時的基礎紅色外觀 */
        .mic-btn.active {
            border-color: #ff3b30;
            background-color: rgba(255, 59, 48, 0.2);
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.3);
        }
        .mic-btn.active svg {
            fill: #ff3b30;
        }
        .status-text {
            font-size: 14px;
            color: #ff3b30; 
            font-weight: 500;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="mic-section">
    <div class="controls-row">
        <button class="vol-btn" onclick="adjustMicVolume(-10)">−</button>
        
        <button class="mic-btn" id="mic-toggle-btn" onclick="toggleMicrophone()">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
        </button>
        
        <button class="vol-btn" onclick="adjustMicVolume(10)">+</button>
    </div>
    
    <div class="status-text" id="status-display">麥克風：已關閉<br>麥克風收音：100%</div>
</div>

<script>
    let audioContext = null;
    let micStream = null;
    let micSource = null;
    let gainNode = null; 
    let analyserNode = null; // 新增：即時音訊分析器節點
    let animationFrameId = null; // 用來取消動畫捕捉
    let isMicOn = false;
    let currentMicVolume = 1.0;

    async function toggleMicrophone() {
        const btn = document.getElementById('mic-toggle-btn');
        if (!isMicOn) {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({
                        sampleRate: 48000
                    });
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                micSource = audioContext.createMediaStreamSource(micStream);
                gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);

                // === 新增：配置音訊分析器 ===
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 64; // 數值越小，運算速度越快，適合即時反應

                // 連線線路：麥克風 -> 擴音控制 -> 分析器 -> 喇叭輸出
                micSource.connect(gainNode);
                gainNode.connect(analyserNode);
                analyserNode.connect(audioContext.destination);

                isMicOn = true;
                btn.classList.add('active');
                updateStatusText();

                // 啟動動態跳動效果
                updateVolumeAnimation();

            } catch (err) {
                console.error(err);
                alert("無法開啟麥克風！請確認：\n1. 網址開頭必須是 https\n2. 必須開啟瀏覽器的麥克風授權。");
            }
        } else {
            // 停止動畫
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            // 恢復按鈕預設樣式
            btn.style.boxShadow = '';
            btn.style.transform = '';

            if (micSource) micSource.disconnect();
            if (gainNode) gainNode.disconnect();
            if (analyserNode) analyserNode.disconnect();
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            isMicOn = false;
            btn.classList.remove('active');
            updateStatusText();
        }
    }

    // === 新增：每秒捕捉 60 次音量大小，動態更新 CSS 外觀 ===
    function updateVolumeAnimation() {
        if (!isMicOn || !analyserNode) return;

        const bufferLength = analyserNode.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        // 抓取當下的時間網域音訊數據（波形）
        analyserNode.getByteTimeDomainData(dataArray);

        // 計算音訊的 RMS (均方根值) 來代表即時音量大小
        let sumSqr = 0;
        for (let i = 0; i < bufferLength; i++) {
            let normalized = (dataArray[i] - 128) / 128; // 轉換為 -1 到 1 的區間
            sumSqr += normalized * normalized;
        }
        let rms = Math.sqrt(sumSqr / bufferLength);

        // 將音量大小等比例放大成視覺參數 (rms 範圍一般在 0 到 0.5 之間)
        let volumeLevel = Math.min(rms * 50, 15); // 控制最大發光強度與縮放幅度

        const btn = document.getElementById('mic-toggle-btn');
        if (btn) {
            if (volumeLevel > 0.5) {
                // 有聲音時：音量越大，紅色發光圈範圍越大、按鈕微幅充氣變大
                let shadowRadius = 15 + (volumeLevel * 4); // 基礎 15px，隨音量變大
                let scaleSize = 1.0 + (volumeLevel * 0.015); // 隨音量變大 1.01 ~ 1.1 倍
                
                btn.style.boxShadow = `0 0 ${shadowRadius}px rgba(255, 59, 48, 0.8)`;
                btn.style.transform = `scale(${scaleSize})`;
            } else {
                // 完全沒聲音時恢復靜態紅色發光
                btn.style.boxShadow = '0 0 15px rgba(255, 59, 48, 0.3)';
                btn.style.transform = 'scale(1)';
            }
        }

        // 持續循環捕捉
        animationFrameId = requestAnimationFrame(updateVolumeAnimation);
    }

    function adjustMicVolume(amount) {
        let newVolPercent = Math.round(currentMicVolume * 100) + amount;
        if (newVolPercent < 0) newVolPercent = 0;
        if (newVolPercent > 200) newVolPercent = 200;
        
        currentMicVolume = newVolPercent / 100;

        if (gainNode && audioContext) {
            gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);
        }
        
        updateStatusText();
    }

    function updateStatusText() {
        const status = document.getElementById('status-display');
        const micState = isMicOn ? "擴音中" : "已關閉";
        const volState = Math.round(currentMicVolume * 100);
        status.innerText = `麥克風：${micState}\n麥克風收音：${volState}%`;
    }
</script>
</body>
</html>
