<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁擴音器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px; 
            width: 100%;
        }
        /* 紅色的麥克風收音音量控制鍵 */
        .vol-btn {
            width: 60px;
            height: 60px;
            border: none;
            background: none;
            color: #ff3b30; 
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .vol-btn:active {
            opacity: 0.5;
        }
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #888888;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .mic-btn svg {
            width: 45px;
            height: 45px;
            fill: #888888;
            pointer-events: none;
        }
        .mic-btn.active {
            border-color: #ff3b30;
            background-color: rgba(255, 59, 48, 0.2);
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
        }
        .mic-btn.active svg {
            fill: #ff3b30;
        }
        .status-text {
            font-size: 14px;
            color: #ff3b30; 
            font-weight: 500;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="mic-section">
    <div class="controls-row">
        <!-- 減少麥克風收音音量 -->
        <button class="vol-btn" onclick="adjustMicVolume(-10)">−</button>
        
        <!-- 圓形麥克風開關 -->
        <button class="mic-btn" id="mic-toggle-btn" onclick="toggleMicrophone()">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
        </button>
        
        <!-- 增加麥克風收音音量 -->
        <button class="vol-btn" onclick="adjustMicVolume(10)">+</button>
    </div>
    
    <div class="status-text" id="status-display">麥克風：已關閉<br>麥克風收音：100%</div>
</div>

<script>
    let audioContext = null;
    let micStream = null;
    let micSource = null;
    let gainNode = null; 
    let isMicOn = false;
    let currentMicVolume = 1.0; // 預設 100%

    async function toggleMicrophone() {
        const btn = document.getElementById('mic-toggle-btn');
        if (!isMicOn) {
            try {
                // 1. 請求麥克風權限
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true, 
                        autoGainControl: true
                    } 
                });

                // 2. 初始化音訊上下文（強制指定藍牙最相容的 48000Hz 採樣率）
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({
                        sampleRate: 48000
                    });
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // 3. 建立連線線路
                micSource = audioContext.createMediaStreamSource(micStream);
                gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);

                // 麥克風 -> 音量控制 -> 喇叭輸出
                micSource.connect(gainNode);
                gainNode.connect(audioContext.destination);

                isMicOn = true;
                btn.classList.add('active');
                updateStatusText();

            } catch (err) {
                console.error(err);
                alert("無法開啟麥克風！請確認：\n1. 網址開頭必須是 https\n2. 必須開啟瀏覽器的麥克風授權。");
            }
        } else {
            // 關閉並切斷線路
            if (micSource) micSource.disconnect();
            if (gainNode) gainNode.disconnect();
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            isMicOn = false;
            btn.classList.remove('active');
            updateStatusText();
        }
    }

    // 調整麥克風音量
    function adjustMicVolume(amount) {
        let newVolPercent = Math.round(currentMicVolume * 100) + amount;
        if (newVolPercent < 0) newVolPercent = 0;
        if (newVolPercent > 200) newVolPercent = 200; // 最大可放大到 200%
        
        currentMicVolume = newVolPercent / 100;

        if (gainNode && audioContext) {
            gainNode.gain.setValueAtTime(currentMicVolume, audioContext.currentTime);
        }
        
        updateStatusText();
    }

    function updateStatusText() {
        const status = document.getElementById('status-display');
        const micState = isMicOn ? "擴音中" : "已關閉";
        const volState = Math.round(currentMicVolume * 100);
        status.innerText = `麥克風：${micState}\n麥克風收音：${volState}%`;
    }
</script>
</body>
</html>
